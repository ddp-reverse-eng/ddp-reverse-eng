name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.14", "5"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocaml
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - run: opam install . --deps-only
      - run: opam exec -- dune build
      # Compares the writer with cue2ddp's recorded output on every experiment
      # and the reader's export with ddpinfo's; test audio is generated with python3.
      - run: opam exec -- dune test
